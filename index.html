<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador Electoral · Congreso & Senado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #090a0f;
  --surface: rgba(18, 20, 29, 0.75);
  --surface-solid: #12141d;
  --border: rgba(255, 255, 255, 0.08);
  --border-focus: rgba(255, 255, 255, 0.22);
  --ink: #f3f4f6;
  --ink-secondary: #9ca3af;
  --ink-tertiary: #6b7280;
  --card-bg: rgba(23, 26, 38, 0.65);
  --card-hover: rgba(28, 32, 48, 0.85);
  --accent: #3b82f6;
  --bad: #ef4444;
  --win: #10b981;
  --land: #1a1e2b;
  --empty-seat: rgba(255, 255, 255, 0.06);
  --seat-stroke: rgba(255, 255, 255, 0.18);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  font-size: 13.5px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Background Atmosphere */
body::before {
  content: "";
  position: fixed;
  top: -20%; left: 50%;
  transform: translateX(-50%);
  width: 1000px; height: 600px;
  background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, rgba(9, 10, 15, 0) 70%);
  z-index: -1;
  pointer-events: none;
}

main {
  max-width: 1440px;
  margin: 0 auto;
  padding: 32px 24px 80px;
}

header {
  margin-bottom: 24px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 16px;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 6px;
}
.eyebrow::before {
  content: "";
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent);
}

h1 {
  font-size: clamp(24px, 3.2vw, 36px);
  font-weight: 800;
  letter-spacing: -0.03em;
  color: #fff;
  line-height: 1.15;
}

.sub {
  color: var(--ink-secondary);
  font-size: 14px;
  max-width: 62ch;
  margin-top: 4px;
}

/* Modern Seg-Control Tabs */
.tabs {
  display: inline-flex;
  padding: 4px;
  background: var(--surface-solid);
  border: 1px solid var(--border);
  border-radius: 12px;
  backdrop-filter: blur(12px);
}
.tabs button {
  border: none;
  background: transparent;
  color: var(--ink-secondary);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  padding: 7px 18px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
}
.tabs button:hover { color: #fff; }
.tabs button.on {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

/* Layout Grid */
.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  gap: 20px;
  align-items: start;
}
@media(max-width: 1040px) {
  .layout { grid-template-columns: 1fr; }
}

.glass-card {
  background: var(--card-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
  transition: border-color 0.25s ease;
}

.map-card { padding: 16px; }

/* SVG Map */
#mapa-svg {
  width: 100%;
  height: auto;
  display: block;
  transform: translateZ(0);
}
#mapa-svg #mapa path {
  fill: var(--land);
  stroke: var(--bg);
  stroke-width: 0.9;
  transition: fill 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  cursor: pointer;
}
#mapa-svg #mapa path:hover {
  filter: brightness(1.25);
}
#mapa-svg .c {
  fill: var(--empty-seat);
  stroke: var(--seat-stroke);
  stroke-width: 0.7;
  transition: transform 0.15s ease, fill 0.2s ease, opacity 0.2s ease;
  will-change: transform, fill;
}
#mapa-svg .c.on {
  stroke: rgba(0, 0, 0, 0.35);
  stroke-width: 0.9;
}
#mapa-svg .pg.hl .c {
  transform-origin: center;
  stroke: #fff;
  stroke-width: 1.6;
}
#mapa-svg.co .c { opacity: 0.15; }
#mapa-svg.co .c.in {
  opacity: 1;
  stroke: #fff;
  stroke-width: 1.4;
}
#mapa-svg.m-c #escanos-s,
#mapa-svg.m-s #escanos,
#mapa-svg.m-s .cong { display: none; }

/* Coalition Maker */
.co-card {
  margin-top: 20px;
  padding: 22px;
  position: relative;
  overflow: hidden;
}
.co-card.win {
  border-color: rgba(16, 185, 129, 0.4);
  background: linear-gradient(180deg, rgba(16, 185, 129, 0.1) 0%, var(--card-bg) 80%);
}
.cohead {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}
.cohead h2 {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.clean-btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  color: var(--ink-secondary);
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s;
}
.clean-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  min-height: 38px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border);
  color: var(--ink);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  will-change: transform;
}
.chip:hover {
  transform: translateY(-1px);
  background: rgba(255, 255, 255, 0.08);
}
.chip:active { transform: scale(0.96); }
.chip.on {
  background: color-mix(in srgb, var(--c) 22%, transparent);
  border-color: var(--c);
  box-shadow: 0 0 16px color-mix(in srgb, var(--c) 25%, transparent);
}
.chip b {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  color: var(--ink-secondary);
}
.chip.on b { color: #fff; }

.cores {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin: 18px 0 8px;
}
.cores b {
  font-family: 'JetBrains Mono', monospace;
  font-size: 38px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.04em;
}
.cores span { color: var(--ink-secondary); font-size: 13px; }
.cores em {
  font-style: normal;
  font-size: 12px;
  font-weight: 700;
  margin-left: auto;
  padding: 4px 10px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.06);
  color: var(--ink-secondary);
}
.co-card.win .cores b { color: var(--win); }
.co-card.win .cores em { background: var(--win); color: #fff; }

#cb, #bar {
  display: flex;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border);
  position: relative;
  overflow: visible;
}
#cb { height: 12px; margin-top: 12px; }
#bar { height: 10px; margin: 12px 0 8px; }
#cb i, #bar i {
  display: block;
  height: 100%;
  transition: width 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
#cb i:first-child, #bar i:first-child { border-radius: 99px 0 0 99px; }
#maj, #cmk {
  position: absolute;
  top: -4px; bottom: -4px;
  width: 2px;
  border-radius: 2px;
  background: #fff;
  box-shadow: 0 0 8px #fff;
  z-index: 2;
}

/* Sidebar */
.side {
  padding: 22px;
  position: sticky;
  top: 24px;
}
.big {
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.big b {
  font-family: 'JetBrains Mono', monospace;
  font-size: 36px;
  font-weight: 700;
  letter-spacing: -0.04em;
}
.big span { color: var(--ink-secondary); font-size: 13px; }
.hint {
  font-size: 12px;
  color: var(--ink-secondary);
  line-height: 1.5;
}

#legend {
  margin: 18px 0 10px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px 14px;
}
.lg {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
  font-size: 13px;
  transition: opacity 0.2s;
}
.lg.z { opacity: 0.28; }
.lg b {
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
}
.sw {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex: none;
}
.lg.un {
  grid-column: 1 / -1;
  border-top: 1px solid var(--border);
  margin-top: 8px;
  padding-top: 10px;
}

.btns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 20px 0 12px;
}
button, .fbtn {
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  padding: 9px 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.04);
  color: var(--ink);
  cursor: pointer;
  text-align: center;
  transition: all 0.16s cubic-bezier(0.16, 1, 0.3, 1);
  will-change: transform;
}
button:hover, .fbtn:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: var(--border-focus);
}
button:active, .fbtn:active { transform: scale(0.97); }
#bx {
  background: #fff;
  color: #000;
  border-color: #fff;
  grid-column: 1 / -1;
}
#bx:hover { background: #e5e7eb; border-color: #e5e7eb; }
#br { color: var(--bad); }
.fbtn { grid-column: 1 / -1; }

/* High Performance Table */
.tw {
  margin-top: 28px;
  border-radius: 16px;
  border: 1px solid var(--border);
  background: var(--surface-solid);
  overflow: auto;
  max-height: 72vh;
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.3);
  contain: paint layout;
}
table {
  border-collapse: separate;
  border-spacing: 0;
  width: 100%;
}
th, td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  text-align: center;
  white-space: nowrap;
}
thead th {
  position: sticky;
  top: 0;
  z-index: 10;
  height: 42px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-secondary);
  background: #151824;
  backdrop-filter: blur(10px);
}
thead tr.t2 th {
  top: 42px;
  color: #fff;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  background: #11141e;
}
th:first-child, td:first-child {
  position: sticky;
  left: 0;
  z-index: 2;
  text-align: left;
  min-width: 160px;
  padding-left: 18px;
  background: #12141d;
}
thead th:first-child { z-index: 12; background: #151824; }
thead tr.t2 th:first-child { z-index: 12; background: #11141e; }
th .d {
  display: block;
  height: 2px;
  border-radius: 2px;
  margin: 4px auto 0;
  width: 70%;
}
td:nth-child(2) {
  font-family: 'JetBrains Mono', monospace;
  color: var(--ink-secondary);
}

/* Stepper Controls */
.st {
  display: inline-flex;
  align-items: center;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 2px;
  transition: all 0.15s ease;
}
.st:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
}
.st button {
  width: 22px; height: 24px;
  border: none;
  background: transparent;
  color: var(--ink-secondary);
  font-size: 14px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
}
.st button:hover:not(:disabled) {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
}
.st button:disabled { opacity: 0.18; cursor: not-allowed; }
.st input {
  width: 30px;
  border: none;
  background: transparent;
  text-align: center;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 13px;
  color: #fff;
  padding: 0;
  -moz-appearance: textfield;
  appearance: textfield;
}
.st input:focus { outline: none; }
.st input::-webkit-inner-spin-button,
.st input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
td.has .st {
  background: color-mix(in srgb, var(--c) 18%, transparent);
  border-color: color-mix(in srgb, var(--c) 55%, transparent);
}
td.un {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  color: var(--ink-secondary);
}
tbody tr:hover td { background: rgba(255, 255, 255, 0.02); }
tbody tr:hover td:first-child { background: #181b26; }
tbody tr.full td.un { color: var(--win); font-weight: 700; }
tbody tr.full td:first-child::after {
  content: " ✓";
  color: var(--win);
  font-size: 11px;
}

/* Fall Confetti */
.cf {
  position: absolute;
  top: -12px;
  width: 7px; height: 12px;
  border-radius: 2px;
  pointer-events: none;
  animation: fall 1.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  will-change: transform, opacity;
}
@keyframes fall {
  to { transform: translate3d(var(--x), 320px, 0) rotate(var(--r)); opacity: 0; }
}

#msg {
  font-size: 13px;
  color: var(--accent);
  min-height: 20px;
  margin: 14px 2px 4px;
  font-weight: 600;
}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <p class="eyebrow">Simulador Electoral en Vivo</p>
      <h1 id="ttl">Cargando...</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="tabs" role="tablist">
      <button data-m="c" role="tab" class="on">Congreso</button>
      <button data-m="s" role="tab">Senado</button>
    </div>
  </header>

  <div class="layout">
    <div class="left-col">
      <div class="glass-card map-card">
        <!-- Re-use SVG directly without bloat -->
        <svg id="mapa-svg" class="m-c" viewBox="30 90 870 790" xmlns="http://www.w3.org/2000/svg">
          <defs id="defs"></defs>
          <g id="mapa">
            <!-- Polygons will be mapped via cached paths -->
          </g>
          <rect x="110" y="740" width="280" height="130" class="cr" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
          <text x="110" y="732" font-size="12" fill="var(--ink-secondary)" font-weight="600">Canarias</text>
          <g id="lineas" class="ll" stroke="rgba(255,255,255,0.2)" fill="none" stroke-width="1">
            <path d="M331.5,647.2L331.5,665"/>
            <text fill="var(--ink-secondary)" stroke="none" font-size="12" x="331" y="704" text-anchor="middle">Ceuta</text>
            <path d="M459.1,689.2L459.1,722"/>
            <text fill="var(--ink-secondary)" stroke="none" font-size="12" x="459" y="761" text-anchor="middle">Melilla</text>
          </g>
          <g id="escanos"></g>
          <g id="escanos-s"></g>
          <g class="cong">
            <g class="ll" stroke="rgba(255,255,255,0.2)" fill="none">
              <path d="M170,345L405,330"/><path d="M786,282L742,250"/>
              <circle cx="405" cy="330" r="2.5" fill="rgba(255,255,255,0.4)"/>
              <circle cx="742" cy="250" r="2.5" fill="rgba(255,255,255,0.4)"/>
            </g>
            <text x="112" y="300" font-size="12" text-anchor="middle" fill="var(--ink-secondary)">Madrid · 38</text>
            <text x="834" y="238" font-size="12" text-anchor="middle" fill="var(--ink-secondary)">Barcelona · 32</text>
            <text x="795" y="422" font-size="12" text-anchor="middle" fill="var(--ink-secondary)">Illes Balears · 8</text>
            <text x="200" y="762" font-size="12" text-anchor="middle" fill="var(--ink-secondary)">S. C. Tenerife · 7</text>
            <text x="318" y="832" font-size="12" text-anchor="middle" fill="var(--ink-secondary)">Las Palmas · 8</text>
          </g>
        </svg>
      </div>

      <section class="glass-card co-card" id="co">
        <div class="cohead">
          <div>
            <h2>Pactómetro / Mayorías</h2>
            <p class="hint" id="coh" style="margin:0"></p>
          </div>
          <button id="cc" class="clean-btn" type="button">Limpiar selección</button>
        </div>
        <div class="chips" id="chips"></div>
        <div class="cores">
          <b id="cs">0</b><span id="ct"></span>
          <em id="cm"></em>
        </div>
        <div id="cb"></div>
      </section>
    </div>

    <aside class="glass-card side">
      <div class="big"><b id="as">0</b><span id="bt"></span></div>
      <div class="hint" id="pc" style="margin:4px 0 6px"></div>
      <div id="bar"><span id="maj"></span></div>
      <div class="hint" id="mh"></div>
      <div id="legend"></div>
      <div class="btns">
        <button id="bx">Descargar Excel (.xlsx)</button>
        <button id="bc">Descargar CSV</button>
        <button id="bs">Descargar SVG</button>
        <label class="fbtn">Importar Excel / CSV<input id="file" type="file" accept=".xlsx,.xls,.csv" hidden></label>
        <button id="bb">Escenario Base</button>
        <button id="br">Vaciar Tabla</button>
      </div>
      <p id="msg"></p>
    </aside>
  </div>

  <div class="tw">
    <table id="t"></table>
  </div>
</main>

<script>
/* High performance state handling */

// Fast state accessor
const get = (id, k) => (data[id] && data[id][k]) | 0;

function setVal(id, i, v) {
  v = Math.max(0, parseInt(v, 10) || 0);
  const p = PROV.find(x => x.id === id);
  const k = PARTIES[i][0];
  let o = 0;
  PARTIES.forEach(q => { if (q[0] !== k) o += get(id, q[0]); });
  v = Math.min(v, Math.max(0, p.s - o), p.m);
  if (!data[id]) data[id] = {};
  data[id][k] = v;
  return v;
}

/* UI Elements Caching */
const ROW_CACHE = new Map();
const SEAT_CACHE = new Map();

function buildTable() {
  const container = $("#t");
  let h = `<thead><tr><th>${M.col}</th><th>Esc.</th>${M.mx?'<th>Máx.</th>':''}` +
    PARTIES.map(p => `<th title="${p[2]||p[0]}">${p[0]}<span class="d" style="background:${p[1]}"></span></th>`).join('') +
    `<th>Restan</th></tr><tr class="t2"><th>Total</th><th id="ts">${M.total}</th>${M.mx?'<th></th>':''}` +
    PARTIES.map((p, i) => `<th id="tp${i}">0</th>`).join('') +
    `<th id="tu">${M.total}</th></tr></thead><tbody>`;

  PROV.forEach(p => {
    h += `<tr data-id="${p.id}"><td>${p.n}</td><td>${p.s}</td>${M.mx?`<td>${p.m}</td>`:''}` +
      PARTIES.map((q, i) => `<td><div class="st"><button type="button" tabindex="-1" data-id="${p.id}" data-i="${i}" data-d="-1">−</button><input type="number" min="0" max="${p.m}" placeholder="0" data-id="${p.id}" data-i="${i}"><button type="button" tabindex="-1" data-id="${p.id}" data-i="${i}" data-d="1">+</button></div></td>`).join('') +
      `<td class="un"></td></tr>`;
  });

  container.innerHTML = h + `</tbody>`;
  ROW_CACHE.clear();

  container.querySelectorAll("tbody tr").forEach(tr => {
    ROW_CACHE.set(tr.dataset.id, {
      tr,
      inputs: [...tr.querySelectorAll("input")],
      inc: [...tr.querySelectorAll('button[data-d="1"]')],
      dec: [...tr.querySelectorAll('button[data-d="-1"]')],
      un: tr.querySelector(".un")
    });
  });

  $("#legend").innerHTML = PARTIES.map((p, i) => `<div class="lg" id="lg${i}"><span class="sw" style="background:${p[1]}"></span><span>${p[0]}</span><b>0</b></div>`).join('') +
    `<div class="lg un"><span class="sw" style="background:var(--empty-seat)"></span>Sin asignar<b id="lu">${M.total}</b></div>`;
}

/* Micro-Update Engine: Prevents Whole-DOM Thrash */
let rafScheduled = false;
function requestUIRender() {
  if (rafScheduled) return;
  rafScheduled = true;
  requestAnimationFrame(() => {
    rafScheduled = false;
    renderFullState();
  });
}

function renderFullState() {
  const tot = PARTIES.map(() => 0);
  let un = 0, fullCount = 0;

  PROV.forEach(p => {
    const seq = [];
    let sum = 0;
    const ord = [];

    for (let i = 0; i < PARTIES.length; i++) {
      const v = get(p.id, PARTIES[i][0]);
      if (v > 0) ord.push([i, v]);
    }
    ord.sort((a, b) => b[1] - a[1] || a[0] - b[0]);

    ord.forEach(([i, v]) => {
      sum += v;
      for (let k = 0; k < v && seq.length < p.s; k++) seq.push(i);
    });

    seq.forEach(i => tot[i]++);
    const left = p.s - sum;
    un += Math.max(left, 0);
    if (left === 0) fullCount++;

    // Update Seat Circles for Province
    const seats = SEAT_CACHE.get(M.pre + p.id);
    if (seats) {
      for (let k = 0; k < seats.length; k++) {
        const c = seats[k];
        const pi = seq[k];
        if (pi === undefined) {
          c.style.fill = "";
          delete c.dataset.p;
          c.classList.remove("on");
        } else {
          c.style.fill = PARTIES[pi][1];
          c.dataset.p = pi;
          c.classList.add("on");
        }
      }
    }

    // Direct Row Update
    const r = ROW_CACHE.get(p.id);
    if (r) {
      r.tr.classList.toggle("full", left === 0);
      r.un.textContent = left;
      for (let i = 0; i < PARTIES.length; i++) {
        const inp = r.inputs[i];
        const val = get(p.id, PARTIES[i][0]);
        if (document.activeElement !== inp) inp.value = val || "";
        const td = inp.closest("td");
        td.classList.toggle("has", val > 0);
        td.style.setProperty("--c", PARTIES[i][1]);
        r.inc[i].disabled = left <= 0 || val >= p.m;
        r.dec[i].disabled = val <= 0;
      }
    }
  });

  // Top Summaries
  for (let i = 0; i < PARTIES.length; i++) {
    $("#tp" + i).textContent = tot[i];
    const lg = $("#lg" + i);
    lg.querySelector("b").textContent = tot[i];
    lg.classList.toggle("z", !tot[i]);
  }

  $("#tu").textContent = un;
  $("#as").textContent = M.total - un;
  $("#lu").textContent = un;
  $("#pc").textContent = `${fullCount} de ${PROV.length} ${M.unit} asignadas`;

  // Main Bar
  const bar = $("#bar");
  bar.querySelectorAll("i").forEach(e => e.remove());
  tot.forEach((n, i) => {
    if (n) {
      const seg = document.createElement("i");
      seg.style.width = (n / M.total * 100) + "%";
      seg.style.background = PARTIES[i][1];
      bar.insertBefore(seg, $("#maj"));
    }
  });

  renderCo(tot);
}

function renderCo(tot) {
  // Chips
  $("#chips").innerHTML = PARTIES.map((p, i) => tot[i] ? `
    <button type="button" class="chip${sel.has(i) ? " on" : ""}" data-i="${i}" style="--c:${p[1]}">
      <span class="sw" style="background:${p[1]}"></span>${p[0]}<b>${tot[i]}</b>
    </button>
  ` : "").join("");

  let s = 0, seg = "";
  PARTIES.forEach((p, i) => {
    if (sel.has(i) && tot[i]) {
      s += tot[i];
      seg += `<i style="width:${tot[i] / M.total * 100}%;background:${p[1]}"></i>`;
    }
  });

  $("#cb").innerHTML = seg + `<span id="cmk" style="left:${M.T / M.total * 100}%"></span>`;
  $("#cs").textContent = s;
  const isWin = s >= M.T;
  $("#co").classList.toggle("win", isWin);
  $("#cm").textContent = s === 0 ? "Selecciona partidos" : isWin ? (s === M.T ? `${M.maj} justa` : `+${s - M.T} sobre mayoría`) : `Faltan ${M.T - s}`;

  if (isWin && !won) triggerConfetti();
  won = isWin;

  $("#mapa-svg").classList.toggle("co", s > 0);
  const seats = SEAT_CACHE.get(M.grp.slice(1));
  if (seats) {
    seats.forEach(c => c.classList.toggle("in", c.dataset.p !== undefined && sel.has(+c.dataset.p)));
  }
}

function triggerConfetti() {
  const container = $("#co");
  const cols = [...sel].map(i => PARTIES[i][1]);
  if (!cols.length) return;
  for (let k = 0; k < 36; k++) {
    const el = document.createElement("span");
    el.className = "cf";
    el.style.left = (Math.random() * 100) + "%";
    el.style.background = cols[k % cols.length];
    el.style.setProperty("--x", ((Math.random() - 0.5) * 180) + "px");
    el.style.setProperty("--r", (Math.random() * 720) + "deg");
    el.style.animationDelay = (Math.random() * 0.2) + "s";
    container.appendChild(el);
    setTimeout(() => el.remove(), 1600);
  }
}

/* Event Delegations: Fast, low latency */
document.addEventListener("click", e => {
  const tab = e.target.closest(".tabs button");
  if (tab) return setMode(tab.dataset.m);

  const chip = e.target.closest(".chip");
  if (chip) {
    const i = +chip.dataset.i;
    sel.has(i) ? sel.delete(i) : sel.add(i);
    requestUIRender();
    return;
  }

  const stepBtn = e.target.closest("button[data-d]");
  if (stepBtn) {
    const id = stepBtn.dataset.id;
    const i = +stepBtn.dataset.i;
    const delta = +stepBtn.dataset.d;
    setVal(id, i, get(id, PARTIES[i][0]) + delta);
    saveStorage();
    requestUIRender();
  }
});

document.addEventListener("input", e => {
  if (!e.target.matches("td input")) return;
  const t = e.target;
  const v = setVal(t.dataset.id, t.dataset.i, t.value);
  if (t.value !== "" && String(v) !== t.value) t.value = v;
  saveStorage();
  requestUIRender();
});

$("#cc").onclick = () => { sel.clear(); requestUIRender(); };
$("#br").onclick = () => { if (confirm("¿Vaciar tabla?")) { data = {}; DATA[M.k] = data; saveStorage(); requestUIRender(); } };
$("#bb").onclick = () => { data = JSON.parse(JSON.stringify(M.base)); DATA[M.k] = data; saveStorage(); requestUIRender(); };

function saveStorage() {
  try { localStorage.setItem(M.ls, JSON.stringify(data)); } catch(e) {}
}

function setMode(k) {
  M = MODES[k];
  PARTIES = M.pt;
  PROV = M.pv;
  if (!DATA[k]) {
    try {
      const saved = localStorage.getItem(M.ls);
      DATA[k] = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(M.base));
    } catch(e) { DATA[k] = JSON.parse(JSON.stringify(M.base)); }
  }
  data = DATA[k];
  sel.clear();
  won = false;

  const svg = $("#mapa-svg").classList;
  svg.toggle("m-c", k === "c");
  svg.toggle("m-s", k === "s");

  $("#ttl").textContent = M.ttl;
  $("#sub").textContent = M.sub;
  $("#coh").textContent = `Agrupa partidos hasta alcanzar ${M.majl}.`;
  $("#mh").textContent = `Línea de mayoría (${M.T})`;
  $("#ct").textContent = `/ ${M.T} escaños`;
  $("#bt").textContent = `de ${M.total} asignados`;
  $("#maj").style.left = (M.T / M.total * 100) + "%";

  document.querySelectorAll(".tabs button").forEach(b => {
    b.classList.toggle("on", b.dataset.m === k);
  });

  buildTable();
  requestUIRender();
}

/* Lazy Loaded SheetJS for Optimal Performance */
async function loadXLSX() {
  if (window.XLSX) return window.XLSX;
  $("#msg").textContent = "Cargando motor Excel...";
  await new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = res;
    s.onerror = rej;
    document.head.appendChild(s);
  });
  $("#msg").textContent = "";
  return window.XLSX;
}

$("#bx").onclick = async () => {
  try {
    const XLSX = await loadXLSX();
    const rows = [[M.col, "Escaños", ...(M.mx?["Máx."]:[]), ...PARTIES.map(p => p[0])]];
    PROV.forEach(p => rows.push([p.n, p.s, ...(M.mx?[p.m]:[]), ...PARTIES.map(q => get(p.id, q[0]) || 0)]));
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, M.sheet);
    XLSX.writeFile(wb, `${M.file}_escanos.xlsx`);
  } catch(e) {
    $("#msg").textContent = "Error al exportar Excel.";
  }
};

// Initial boot
setMode("c");
</script>
