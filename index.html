<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<title>Congreso de los Diputados · mapa editable</title>
<style>
:root{--bg:#fff;--card:#fafaf8;--ink:#17171a;--mute:#77756d;--line:#e9e7e0;--land:#eeeae1;--empty:#fff;--stk:#a19e93;--bad:#c4281c;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
main{max-width:1360px;margin:0 auto;padding:32px 20px 64px;animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.eyebrow{margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
h1{font-size:clamp(26px,3.4vw,38px);font-weight:700;letter-spacing:-.025em;line-height:1.1;margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 26px;font-size:15px;max-width:62ch;line-height:1.5}
.top{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
@media(max-width:960px){.top{grid-template-columns:1fr}}
.mapcard,.side,.tw{background:var(--bg);border:1px solid var(--line);border-radius:20px;box-shadow:0 1px 2px rgba(20,20,20,.04),0 12px 32px -12px rgba(20,20,20,.08)}
.mapcard{padding:14px}
#mapa-svg{width:100%;height:auto;max-width:100%;display:block}
#mapa-svg #mapa{fill:var(--land);stroke:var(--bg);stroke-width:.8}
#mapa-svg .c{fill:var(--empty);stroke:var(--stk);stroke-width:.7;transition:fill .16s ease,stroke .16s ease}
#mapa-svg .c.on{stroke:var(--bg);stroke-width:1}
#mapa-svg .pg.hl .c{stroke:var(--ink);stroke-width:1.4}
#mapa-svg .lb{fill:var(--mute)}
#mapa-svg .ll{stroke:var(--stk);fill:none;stroke-width:1}
#mapa-svg .ll circle{fill:var(--stk);stroke:none}
#mapa-svg .cr{fill:none;stroke:var(--stk);stroke-width:1.2}
#mapa-svg text{stroke:none}
.side{padding:20px;position:sticky;top:16px}
@media(max-width:960px){.side{position:static}}
.big{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.big b{font-size:38px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big span{color:var(--mute);font-size:13px}
#bar{display:flex;height:10px;border-radius:99px;overflow:visible;background:var(--card);border:1px solid var(--line);margin:12px 0 6px;position:relative}
#bar i{display:block;height:100%;transition:width .18s ease}
#bar i:first-child{border-radius:99px 0 0 99px}
#maj{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:var(--ink);left:50.29%}
.hint{font-size:12px;color:var(--mute);line-height:1.5}
#legend{margin:16px 0 4px;display:grid;grid-template-columns:1fr 1fr;gap:2px 16px}
.lg{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13.5px;transition:opacity .2s}
.lg b{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
.sw{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.lg.z{opacity:.35}
.lg.un{grid-column:1/-1;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 12px}
button,.fbtn{font:inherit;font-size:13px;font-weight:500;padding:9px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;text-align:center;transition:background .15s,border-color .15s,transform .1s}
button:hover,.fbtn:hover{background:var(--card);border-color:var(--stk)}
button:active,.fbtn:active{transform:scale(.97)}
button:focus-visible,.fbtn:focus-within,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#bx{background:var(--ink);color:#fff;border-color:var(--ink)}
#bx:hover{background:#34343a;border-color:#34343a}
#br{color:var(--bad)}
.fbtn{grid-column:1/-1}
#msg{font-size:13px;color:var(--mute);min-height:20px;margin:18px 2px 8px}
.tw{overflow:auto;max-height:72vh;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;background:var(--bg)}
tbody tr:last-child td{border-bottom:0}
thead th{position:sticky;top:0;z-index:2;height:44px;font-size:12px;font-weight:600;color:var(--mute);background:var(--card)}
thead tr.t2 th{top:44px;color:var(--ink);font-size:13px;font-variant-numeric:tabular-nums;font-weight:700}
th:first-child,td:first-child{position:sticky;left:0;text-align:left;z-index:1;min-width:170px;padding-left:16px}
td:first-child{font-weight:500}
thead th:first-child{z-index:3}
th .d{display:block;height:3px;border-radius:3px;margin:4px auto 0;width:70%}
td:nth-child(2){color:var(--mute);font-variant-numeric:tabular-nums}
.st{display:inline-flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px;transition:border-color .15s,background .2s,box-shadow .15s}
.st:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px rgba(23,23,26,.08)}
.st button{width:24px;height:26px;border:0;border-radius:8px;background:transparent;color:var(--mute);font-size:16px;line-height:1;padding:0}
.st button:disabled{opacity:.22;cursor:not-allowed;background:transparent!important}
.st button:hover{background:rgba(20,20,20,.07);color:var(--ink)}
.st input{width:32px;border:0;background:transparent;text-align:center;font:inherit;font-weight:600;padding:0;color:var(--ink);-moz-appearance:textfield;appearance:textfield}
.st input:focus-visible{outline:0}
.st input::placeholder{color:#c3c0b6;font-weight:400}
.st input::-webkit-inner-spin-button,.st input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
td.has .st{background:color-mix(in srgb,var(--c) 14%,#fff);border-color:color-mix(in srgb,var(--c) 40%,#fff)}
td.un{font-variant-numeric:tabular-nums;color:var(--mute);font-weight:500}
tr.over td{background:#fdf1ef}
tr.over td.un{color:var(--bad);font-weight:700}
tr.full td.un{color:#2e8b4f;font-weight:600}
tbody tr:hover td{background:#f4f4f1}
tbody tr.over:hover td{background:#fbe6e2}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.top{grid-template-rows:auto 1fr}
.mapcard{grid-column:1;grid-row:1}
.side{grid-column:2;grid-row:1/span 2}
.co{grid-column:1;grid-row:2;position:relative;overflow:hidden;padding:20px 22px;background:var(--bg);border:1px solid var(--line);border-radius:20px;box-shadow:0 1px 2px rgba(20,20,20,.04),0 12px 32px -12px rgba(20,20,20,.08);transition:border-color .3s,background .4s}
@media(max-width:960px){.mapcard,.side,.co{grid-column:1;grid-row:auto}}
.cohead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.cohead h2{margin:0 0 4px;font-size:18px;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:38px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px 7px 10px;border-radius:99px;font-weight:600}
.chip b{font-weight:700;font-variant-numeric:tabular-nums;color:var(--mute)}
.chip.on{background:color-mix(in srgb,var(--c) 14%,#fff);border-color:var(--c)}
.chip.on b{color:var(--ink)}
.cores{display:flex;align-items:baseline;gap:8px;margin:18px 0 4px;flex-wrap:wrap}
.cores b{font-size:40px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.cores span{color:var(--mute)}
.cores em{font-style:normal;font-size:13px;font-weight:600;margin-left:auto;padding:5px 12px;border-radius:99px;background:var(--card);color:var(--mute);transition:background .3s,color .3s}
#cb{display:flex;height:12px;border-radius:99px;background:var(--card);border:1px solid var(--line);position:relative;margin:12px 0 4px}
#cb i{display:block;height:100%;transition:width .18s ease}
#cb i:first-child{border-radius:99px 0 0 99px}
#cmk{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:var(--ink);left:50.29%}
.co.win{border-color:#2e8b4f;background:linear-gradient(180deg,#eef9f1,#fff 70%)}
.co.win .cores b{color:#2e8b4f;animation:pop .5s ease}
.co.win .cores em{background:#2e8b4f;color:#fff}
@keyframes pop{40%{transform:scale(1.15)}}
.cf{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;pointer-events:none;animation:fall 1.5s ease-in forwards}
@keyframes fall{to{transform:translate(var(--x),280px) rotate(var(--r));opacity:0}}
#mapa-svg.co .c{opacity:.18}
#mapa-svg.co .c.in{opacity:1}
tr.full td{background:var(--card)}
tr.full td:first-child::after{content:"✓";margin-left:8px;color:#2e8b4f;font-size:12px;font-weight:700}
tbody tr.full:hover td{background:#efefeb}
#mapa-svg .tp{transition:fill .18s ease}

.tabs{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin:0 0 22px}
.tabs button{border:0;background:transparent;padding:8px 20px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mute)}
.tabs button:hover{background:rgba(20,20,20,.06);border-color:transparent}
.tabs button.on,.tabs button.on:hover{background:var(--ink);color:#fff}
#mapa-svg.m-c #escanos-s,#mapa-svg.m-s #escanos,#mapa-svg.m-s .cong{display:none}
td.mx{color:var(--mute);font-variant-numeric:tabular-nums}
</style>
</head>

  $("#ttl").textContent=M.ttl;$("#sub").textContent=M.sub+SUB;
  $("#coh").textContent=`Marca los partidos que quieres juntar y comprueba si suman ${M.majl} (${M.T}).`;
  $("#mh").textContent=`La línea marca ${M.majl} (${M.T})`;$("#ct").textContent=`/ ${M.T} escaños`;$("#bt").textContent=`de ${M.total} escaños asignados`;
  $("#maj").style.left=(M.T/M.total*100)+"%";
  document.querySelectorAll(".tabs button").forEach(b=>{b.classList.toggle("on",b.dataset.m===k);b.setAttribute("aria-selected",b.dataset.m===k)});
  buildMaps();build();render();say("");
  try{localStorage.setItem("congreso-modo",k)}catch(e){}
}
document.addEventListener("click",e=>{
  const t=e.target.closest&&e.target.closest(".tabs button");if(t){setMode(t.dataset.m);return}
  const c=e.target.closest&&e.target.closest(".chip");if(c){const i=+c.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);render();return}
  const b=e.target.closest&&e.target.closest("button[data-d]");if(!b)return;
  const p=PROV.find(x=>x.id===b.dataset.id);setVal(p.id,b.dataset.i,get(p.id,PARTIES[b.dataset.i][0])+ +b.dataset.d);save();render();
});
$("#cc").onclick=()=>{sel.clear();render()};
let pendingInputRender=false;
document.addEventListener("input",e=>{
  const t=e.target;if(!t.matches("td input"))return;
  const v=setVal(t.dataset.id,t.dataset.i,t.value);
  if(t.value!==""&&String(v)!==t.value)t.value=v;
  save();
  if(!pendingInputRender){pendingInputRender=true;requestAnimationFrame(()=>{pendingInputRender=false;render()})}
});
document.addEventListener("focusout",e=>{if(e.target.matches("td input"))render()});
document.addEventListener("paste",e=>{
  const t=e.target;if(!t.matches||!t.matches("td input"))return;
  const txt=(e.clipboardData||window.clipboardData).getData("text");
  if(!/[\t\n]/.test(txt.trim()))return;
  e.preventDefault();
  const r=PROV.findIndex(p=>p.id===t.dataset.id),c0=+t.dataset.i;
  txt.replace(/\r/g,"").split("\n").filter(l=>l.length).forEach((line,ri)=>{
    let cells=line.split("\t");if(cells.length>1&&isNaN(cells[0].trim()))cells=cells.slice(1);
    const p=PROV[r+ri];if(!p)return;
    cells.forEach((v,ci)=>{if(c0+ci<PARTIES.length&&v.trim()!==""&&!isNaN(v))setVal(p.id,c0+ci,v)});
  });
  save();render();say("Datos pegados.");
});
let hoveredRow=null;
document.addEventListener("mouseover",e=>{
  const tr=e.target.closest&&e.target.closest("#t tbody tr");
  if(tr===hoveredRow)return;
  hoveredRow=tr;
  document.querySelectorAll(".pg.hl").forEach(g=>g.classList.remove("hl"));
  if(tr){const g=document.getElementById(M.pre+tr.dataset.id);if(g)g.classList.add("hl")}
});
$("#br").onclick=()=>{if(confirm("¿Vaciar toda la tabla?")){setData({});save();render();say("Tabla vaciada.")}};
$("#bb").onclick=()=>{setData(JSON.parse(JSON.stringify(M.base)));save();render();say("Escenario base restaurado.")};
$("#file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  if(typeof XLSX==="undefined"){say("No se pudo cargar la librería de Excel. Usa pegar desde Excel.");return}
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});
    const hi=rows.findIndex(r=>r.some(c=>pmap[norm(c)]));if(hi<0)throw new Error("No encuentro la fila de partidos");
    const cols={};rows[hi].forEach((c,j)=>{const k=pmap[norm(c)];if(k)cols[j]=PARTIES.findIndex(p=>p[0]===k)});
    let n=0,trim=0,bad=[];
    rows.slice(hi+1).forEach(r=>{const nm=norm(r[0]);if(!nm||nm==="total")return;const id=vmap[nm];if(!id){bad.push(r[0]);return}
      PARTIES.forEach((p,i)=>setVal(id,i,0));let raw=0;Object.keys(cols).forEach(j=>{raw+=parseInt(r[j],10)||0;setVal(id,cols[j],r[j])});if(raw>PROV.find(x=>x.id===id).s)trim++;n++});
    save();render();say(`Importadas ${n} filas`+(bad.length?` · no reconocidas: ${bad.join(", ")}`:"")+(trim?` · ${trim} filas superaban los escaños y se recortaron`:"")+".");
  }catch(err){say("Error al importar: "+err.message)}
  e.target.value="";
};
async function saveFile(name,body){
  let d=null;try{d=await claude.use("downloads")}catch(e){}
  if(!d){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([body]));a.download=name;document.body.appendChild(a);a.click();a.remove();say("Archivo descargado.");return}
  try{await d.save({filename:name,data:body});say("Archivo guardado.")}catch(err){if(err&&err.code!=="declined")say("No se pudo guardar: "+(err.message||err.code))}
}
const tableRows=()=>{const r=[[M.col,"Escaños",...(M.mx?["Máx. por partido"]:[]),...PARTIES.map(p=>p[0])]];PROV.forEach(p=>r.push([p.n,p.s,...(M.mx?[p.m]:[]),...PARTIES.map(q=>get(p.id,q[0])||0)]));return r};
$("#bx").onclick=()=>{
  if(typeof XLSX==="undefined"){say("No se pudo cargar la librería de Excel. Descarga el CSV: se abre igual en Excel.");return}
  const ws=XLSX.utils.aoa_to_sheet(tableRows());ws["!cols"]=[{wch:24},{wch:8},...(M.mx?[{wch:10}]:[]),...PARTIES.map(()=>({wch:9}))];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,M.sheet);
  saveFile(`${M.file}_escanos.xlsx`,XLSX.write(wb,{type:"array",bookType:"xlsx"}));
};
$("#bc").onclick=()=>{const q=s=>/[",;\n]/.test(s)?'"'+String(s).replace(/"/g,'""')+'"':s;saveFile(`${M.file}_escanos.csv`,"\ufeff"+tableRows().map(r=>r.map(q).join(",")).join("\r\n"))};
$("#bs").onclick=()=>{
  const sv=$("#mapa-svg").cloneNode(true);
  sv.querySelectorAll(M.k==="c"?"#escanos-s":".cong,#escanos").forEach(e=>e.remove());
  sv.querySelectorAll(".c").forEach(c=>{const f=c.style.fill;c.setAttribute("fill",f||"#ffffff");c.setAttribute("stroke",f?"#ffffff":"#8a8a80");c.setAttribute("stroke-width",f?1:.7);c.removeAttribute("style");c.removeAttribute("class")});
  const m=sv.querySelector("#mapa");m.setAttribute("fill","#ece8df");m.setAttribute("stroke","#ffffff");
  sv.querySelectorAll(".lb").forEach(t=>t.setAttribute("fill","#6b6b66"));
  sv.querySelectorAll(".ll").forEach(g=>{g.setAttribute("stroke","#8a8a80");g.setAttribute("fill","none")});
  sv.querySelectorAll(".ll circle").forEach(c=>{c.setAttribute("fill","#8a8a80");c.setAttribute("stroke","none")});
  sv.querySelectorAll(".cr").forEach(c=>{c.setAttribute("fill","none");c.setAttribute("stroke","#8a8a80")});
  sv.querySelectorAll("title").forEach(t=>t.remove());
  sv.insertAdjacentHTML("afterbegin",'<rect x="30" y="90" width="870" height="790" fill="#ffffff"/>');
  saveFile(`mapa_${M.file}.svg`,'<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(sv));
};
loadMode(MODES.c);loadMode(MODES.s);
let m0="c";try{m0=localStorage.getItem("congreso-modo")==="s"?"s":"c"}catch(e){}
setMode(m0);

</script>
</body>
